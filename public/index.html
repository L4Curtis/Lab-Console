<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="common.shell.appTitle">Lab Console</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='6' width='24' height='20' rx='4' fill='%233E8FC9'/%3E%3Cpath d='M10 14l4 3-4 3M16 21h6' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <!-- Everything is self-hosted: the platform works on isolated lab networks -->
  <link rel="stylesheet" href="/vendor/fonts/plex-sans/400.css" />
  <link rel="stylesheet" href="/vendor/fonts/plex-sans/500.css" />
  <link rel="stylesheet" href="/vendor/fonts/plex-sans/600.css" />
  <link rel="stylesheet" href="/vendor/fonts/plex-mono/400.css" />
  <link rel="stylesheet" href="/vendor/fonts/plex-mono/500.css" />
  <link rel="stylesheet" href="/vendor/xterm/css/xterm.css" />
  <link rel="stylesheet" href="/css/app.css" />
  <script type="module" src="/js/main.js"></script>
</head>
<body>
  <div class="app">
    <nav class="rail" aria-label="Sections" data-i18n-aria-label="common.shell.sections">
      <a class="rail-brand" href="#/home" title="Lab Console" data-i18n-title="common.shell.appTitle">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="4" y="6" width="24" height="20" rx="4" /><path d="M10 14l4 3-4 3M16 21h6" /></svg>
      </a>
      <div class="rail-items" id="rail-items"></div>
      <div class="rail-lang" role="group" aria-label="Langue" data-i18n-aria-label="common.shell.language.label">
        <button class="lang-btn" type="button" data-lang="fr" lang="fr" title="Français" data-i18n-title="common.shell.language.fr" aria-pressed="true">FR</button>
        <button class="lang-btn" type="button" data-lang="en" lang="en" title="English" data-i18n-title="common.shell.language.en" aria-pressed="false">EN</button>
      </div>
      <button class="rail-btn" id="theme-toggle" type="button" title="Basculer entre clair et sombre" data-i18n-title="common.shell.theme.toggle">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z" /></svg>
        <span data-i18n="common.shell.theme.label">Thème</span>
      </button>
    </nav>
    <main class="views" id="views"></main>
  </div>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
</body>
</html>
